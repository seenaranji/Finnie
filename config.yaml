# Finnie settings. Safe to commit: NO secrets here (those live in .env).
# Every value below is a starting default; later steps tune them with data.

app:
  log_level: INFO            # DEBUG | INFO | WARNING | ERROR

llm:
  # Verified 2026-10-29: prices from OpenAI's pricing page; models checked against what
  # THIS API key can actually use (client.models.list()). gpt-6* exist but are not enabled
  # for this project (403).
  answer_model: gpt-4o       # non-reasoning, so it accepts temperature
  router_model: gpt-4o-mini  # cheapest accessible: the router only classifies
  timeout_seconds: 30
  max_retries: 3
  # Dollars per 1 million tokens (standard). Re-check before trusting cost numbers.
  prices_per_million_tokens:
    answer_model:    {input: 2.50, output: 10.00}
    router_model:    {input: 0.15, output: 0.60}
    embedding_model: {input: 0.02, output: 0.0}

rag:
  embedding_model: text-embedding-3-small
  chunk_size: 500            # characters; a guess, compared with 200/1000 in Step 8
  chunk_overlap: 50
  top_k: 5
  similarity_threshold: 0.465  # midpoint of the gap between answerable (min 0.482) and unanswerable (max 0.448) scores, Step 7
  chroma_path: chroma_db     # where the vector database is saved on disk
  collection_name: finnie_knowledge_base
  candidate_k: 20            # fetch this many, then threshold -> dedupe -> (rerank) -> keep top_k
  rerank: false              # LLM re-ordering of candidates; off until Step 8 measures it
  dedupe_overlap: 0.8        # drop a chunk if 80% of its words already appear in a better-ranked chunk

cache:
  quote_ttl_seconds: 60
  history_ttl_seconds: 900   # 15 minutes
