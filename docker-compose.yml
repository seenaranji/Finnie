# Finnie's full stack (Step 26): db (PostgreSQL + pgvector) -> migrate (one-off) -> api -> ui.
# First time:  docker compose up -d --build
#              docker compose run --rm api python -m scripts.index_knowledge_base    (fills the knowledge base; about $0.001 of embeddings)
# Then open http://localhost:8501.   Check: docker compose ps   (wait for "healthy")
# Database only (to run the app from your own Python): docker compose up -d db
# Credentials come from .env (git-ignored). The data lives in the named volume below, so it survives
# `docker compose down` but NOT `docker compose down -v` (that deletes the volume and every saved row).
services:
  db:
    image: pgvector/pgvector:pg17   # official pgvector build on PostgreSQL 17 (verified 2026-11-01)
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # localhost only; 5433 so it never clashes with a Homebrew PostgreSQL on 5432
    volumes:
      - finnie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared cache for PUBLIC market data and news only. Password required, no host port, no disk persistence (nothing to retain or erase),
  # memory-capped with LRU eviction. Turn it on with cache.backend: redis in config.yaml and REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0 in .env.
  redis:
    profiles: ["cache"]   # off by default: start with `docker compose --profile cache up -d`
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-off job: bring the schema up to date, then exit. api and ui wait for it to finish successfully.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app_env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}   # inside the network the host is "db" and the port 5432, not 127.0.0.1:5433
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file: .env             # keys and JWT_SECRET are read at run time; they are not in the image
    environment: *app_env      # applied after env_file, so the container's DATABASE_URL wins over the one meant for your laptop
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - finnie_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  ui:
    build: .
    restart: unless-stopped
    command: ["streamlit", "run", "src/web_app/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      FINNIE_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  finnie_pgdata:
  finnie_logs:
